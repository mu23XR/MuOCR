name: MuOCR Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Upload APK for download (retained for 1 day)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: muocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint and build MuOCR
        run: gradle :ocrtool:testDebugUnitTest :ocrtool:lintRelease :ocrtool:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="ocrtool/build/outputs/apk/release/ocrtool-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='dev.munote.ocrtool'"
          sha256sum "$APK" > "$APK.sha256"
      - name: Summarize checks
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in Path('ocrtool/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          lint = Path('ocrtool/build/reports/lint-results-release.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## MuOCR checks\n\n')
              if suites:
                  counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
                  out.write(f'Unit tests: {counts}\n\n')
              else:
                  out.write('No unit test XML was produced.\n\n')
              if lint.is_file():
                  issues = ET.parse(lint).getroot()
                  errors = sum(i.get('severity') in ('Error', 'Fatal') for i in issues)
                  warnings = sum(i.get('severity') == 'Warning' for i in issues)
                  out.write(f'Full lint: {errors} errors, {warnings} warnings.\n\n')
              else:
                  out.write('No full lint XML was produced.\n\n')
              checksum = Path('ocrtool/build/outputs/apk/release/ocrtool-release.apk.sha256')
              if checksum.is_file():
                  out.write('APK SHA256:\n\n```text\n' + checksum.read_text() + '```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.upload_apk }}
        with:
          name: MuOCR-apk
          path: |
            ocrtool/build/outputs/apk/release/ocrtool-release.apk
            ocrtool/build/outputs/apk/release/ocrtool-release.apk.sha256
          retention-days: 1
